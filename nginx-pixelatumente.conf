# pixelatumente.es — config final (VPS HostUp 136.148.218.48)
# 1. www → apex en 443 (DEBE ir antes que el bloque principal)
server {
    listen 443 ssl;
    http2 on;
    server_name www.pixelatumente.es;
    ssl_certificate /etc/letsencrypt/live/pixelatumente.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixelatumente.es/privkey.pem;
    return 301 https://pixelatumente.es$request_uri;
}

# 2. Principal (solo apex)
server {
    server_name pixelatumente.es;
    root /var/www/pixelatumente.es/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/pixelatumente.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixelatumente.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeceras que Cloudflare Pages inyectaba (no había public/_headers)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Access-Control-Allow-Origin * always;
}

# 3. Puerto 80: acme-challenge (webroot) + redirect global con guardia
server {
    listen 80;
    server_name pixelatumente.es www.pixelatumente.es;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    if ($uri !~ '^/\.well-known/acme-challenge/') {
        return 301 https://pixelatumente.es$request_uri;
    }
}
